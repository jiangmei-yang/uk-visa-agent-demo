name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: make lint
      - run: make typecheck
      - name: Run complete regression with hang diagnostics
        run: uv run pytest -o faulthandler_timeout=60 --durations=20 --junitxml=/tmp/visa-regression.xml
      - run: make demo
      - run: make stability
        env:
          STABILITY_RUNS: "5"
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - run: curl --fail --silent --show-error http://127.0.0.1:8000/health
      - run: |
          curl --fail --silent --show-error \
            --output /tmp/visa-application-pack.zip \
            http://127.0.0.1:8000/api/cases/case-7b2f8d0650eb/pack
          unzip -t /tmp/visa-application-pack.zip
      - name: Verify fresh-container delivery gates and ZIP
        run: uv run python scripts/release_smoke.py --base-url http://127.0.0.1:8000
      - if: always()
        run: docker compose down
