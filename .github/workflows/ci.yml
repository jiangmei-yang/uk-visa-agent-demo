name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make demo
      - run: make stability
        env:
          STABILITY_RUNS: "5"
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - run: curl --fail --silent --show-error http://127.0.0.1:8000/health
      - run: |
          curl --fail --silent --show-error \
            --output /tmp/visa-application-pack.zip \
            http://127.0.0.1:8000/api/cases/case-7b2f8d0650eb/pack
          unzip -t /tmp/visa-application-pack.zip
      - if: always()
        run: docker compose down
