name: uk-visa-agent-demo

services:
  review-console:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      VISA_AGENT_DATABASE: /app/runtime/data/visa_agent.db
      VISA_AGENT_OUTPUT_DIR: /app/runtime/demo_output
    restart: unless-stopped
    volumes:
      - review-runtime:/app/runtime

volumes:
  review-runtime:
